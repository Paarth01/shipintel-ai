name: CI

on:
  push: {branches: [main]}
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly: catches newly published advisories without a code change

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.lock}
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: mypy app

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: {python-version: ["3.11", "3.12"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python-version }}", cache: pip, cache-dependency-path: requirements-dev.lock}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Tests with coverage gate
        run: |
          coverage run --branch --source=app -m pytest
          coverage report --skip-empty --fail-under=85
      - name: Synthetic data generator is deterministic
        run: |
          python scripts/generate_synthetic_data.py --out /tmp/gen1 > /dev/null
          python scripts/generate_synthetic_data.py --out /tmp/gen2 > /dev/null
          diff -r /tmp/gen1/annotations /tmp/gen2/annotations

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.lock}
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Static security analysis
        run: bandit -r app -ll
      - name: Known-vulnerability scan of the locked runtime dependencies
        run: pip-audit -r requirements.lock --require-hashes --no-deps --disable-pip
      - name: ... and of the dev tooling
        run: pip-audit -r requirements-dev.lock --require-hashes --no-deps --disable-pip

  docker:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: Dockerfile, failure-threshold: warning}
      - run: docker build -t shipintel-ai:ci .
      - name: Container starts, refuses to run without API keys, serves /health with them
        run: |
          out=$(docker run --rm shipintel-ai:ci 2>&1 || true)
          echo "$out" | grep -q "SHIPINTEL_API_KEYS" || { echo "expected a startup refusal mentioning SHIPINTEL_API_KEYS"; echo "$out"; exit 1; }
          docker run -d --name api -e SHIPINTEL_API_KEYS="ci:0123456789abcdef0123456789abcdef" -p 8000:8000 shipintel-ai:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break || sleep 1; done
          curl -fsS localhost:8000/ready
          docker exec api id -u | grep -qx 10001
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: shipintel-ai:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
