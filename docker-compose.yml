# Local/single-host deployment. Ports are bound to 127.0.0.1: put a TLS reverse proxy (with its own
# authentication for the UI) in front before exposing anything. Secrets come from .env (git-ignored):
#   SHIPINTEL_API_KEYS=ui:<24+ random chars>,partner:<24+ random chars>
#   SHIPINTEL_UI_API_KEY=<the 'ui' key above>
# Statically validated only; not run in the authoring environment (no Docker).
x-hardened: &hardened
  image: shipintel-ai:local
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: 3g
  cpus: 2

services:
  api:
    <<: *hardened
    build:
      context: .
      args:
        WITH_OCR: "false"
    env_file: .env
    environment:
      SHIPINTEL_ENV: production
      SHIPINTEL_WORKERS: "2"
      SHIPINTEL_WORKER_MEMORY_MB: "2048"
    ports:
      - "127.0.0.1:8000:8000"

  ui:
    <<: *hardened
    command: ["streamlit", "run", "app/ui.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      SHIPINTEL_API_URL: http://api:8000
      SHIPINTEL_API_KEY: ${SHIPINTEL_UI_API_KEY:?set SHIPINTEL_UI_API_KEY in .env}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
